name: Build CamMicGo Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-kamiko/**'
      - '.github/workflows/android-kamiko-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu runners include the Android command-line SDK; avoid setup-android@v3
      # which currently attempts to install the removed 'tools' SDK package.
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-kamiko
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cammicgo-seo-android-debug-apk
          path: android-kamiko/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
