name: Build CamMicGo Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-kamiko/**'
      - '.github/workflows/android-kamiko-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu runners include the Android command-line SDK; avoid setup-android@v3
      # which currently attempts to install the removed 'tools' SDK package.
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Android launcher icons from the official CamMicGo SVG
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          source = Path("public/logo.svg").read_bytes()
          root = Path("android-kamiko/app/src/main/res")
          for density, size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              target = root / ("mipmap-" + density) / "ic_launcher.png"
              target.parent.mkdir(parents=True, exist_ok=True)
              cairosvg.svg2png(bytestring=source, write_to=str(target), output_width=size, output_height=size)
          PY
      - name: Build debug APK
        working-directory: android-kamiko
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cammicgo-seo-android-debug-apk
          path: android-kamiko/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Android test APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-kamiko/app/build/outputs/apk/debug/app-debug.apk CamMicGo-SEO-MCP-Android-test.apk
          if gh release view android-test-latest >/dev/null 2>&1; then
            gh release upload android-test-latest CamMicGo-SEO-MCP-Android-test.apk --clobber
          else
            gh release create android-test-latest CamMicGo-SEO-MCP-Android-test.apk --title "CamMicGo Android test APK" --notes "Experimental debug build: local YouTube captions only; remote MCP pairing is not yet implemented." --prerelease --target "$GITHUB_SHA"
          fi
