name: Android UI screenshots
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [android-kamiko/**, benchmarks/ui/**, .github/workflows/android-screenshots.yml]
permissions: {contents: read}
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build debug APK
        working-directory: android-kamiko
        run: gradle :app:assembleDebug --no-daemon -q
      - run: pip install -q pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            adb install -r -g android-kamiko/app/build/outputs/apk/debug/app-debug.apk
            adb shell "run-as com.cammicgo.kamikoseo mkdir -p shared_prefs && echo '<?xml version=\"1.0\" encoding=\"utf-8\" standalone=\"yes\" ?><map><string name=\"lang\">fr</string></map>' | run-as com.cammicgo.kamikoseo sh -c 'cat > shared_prefs/cammicgo_ui.xml'"
            python3 benchmarks/ui/screens.py
