name: Local ASR benchmark (Qwen3-ASR 0.6B int8)
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [benchmarks/asr/**, .github/workflows/asr-bench.yml, android-kamiko/**]
permissions: {contents: read}
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Model (cached)
        id: model
        uses: actions/cache@v4
        with: {path: model, key: qwen3-asr-0.6b-int8-2026-03-25}
      - name: Download model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o m.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-qwen3-asr-0.6B-int8-2026-03-25.tar.bz2
          echo "TARBALL_BYTES $(stat -c %s m.tar.bz2) SHA256 $(sha256sum m.tar.bz2 | cut -d' ' -f1)"
          mkdir model && tar -xjf m.tar.bz2 -C model --strip-components=1 && rm m.tar.bz2 && rm -rf model/test_wavs && du -sh model/*
      - run: pip install -q "sherpa-onnx==2.0.1" supertonic soundfile numpy
      - run: python benchmarks/asr/make_audio.py audio
      - uses: actions/upload-artifact@v4
        with: {name: asr-audio, path: audio, retention-days: 3}
      - name: Benchmark, 2 threads (phone-like)
        run: THREADS=2 python benchmarks/asr/bench.py model audio
      - name: Benchmark, 4 threads
        run: THREADS=4 python benchmarks/asr/bench.py model audio | grep -E "LOAD|RESULT"
      - name: Benchmark, phone settings (15 s segments, shorter context)
        run: THREADS=2 MAX_SEG=15 MAX_TOTAL_LEN=512 MAX_NEW_TOKENS=256 python benchmarks/asr/bench.py model audio | grep -E "LOAD|RESULT"

  android-device:
    # The same transcription on Android: emulator (x86_64, 6 GB), real model, real MediaCodec decoding.
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build app and device test
        working-directory: android-kamiko
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - uses: actions/cache/restore@v4
        with: {path: model, key: qwen3-asr-0.6b-int8-2026-03-25, fail-on-cache-miss: true}
      - uses: actions/download-artifact@v4
        with: {name: asr-audio, path: audio}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          ram-size: 6144M
          disk-size: 8G
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash benchmarks/asr/emulator.sh
